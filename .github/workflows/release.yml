name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm run build

      - name: Package extension
        run: |
          cd dist
          zip -r ../cyber-bookmark-newtab-${GITHUB_REF_NAME}.zip .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "cyber-bookmark-newtab-${GITHUB_REF_NAME}.zip" \
            --title "Cyber Bookmark ${GITHUB_REF_NAME}" \
            --notes "Download the zip, unzip it, then load the extracted folder in Chrome extensions with Developer mode enabled."
